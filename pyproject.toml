[project]
name = "telemetry-token"
version = "1.0.0"
description = "Token Optimization Stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "types-PyYAML",
    "pre-commit>=4.6.0",
]
desktop = [
    "pywebview>=5.0,<6",
    "pyyaml>=6.0",
    "llmlingua>=0.2.2",
    "transformers>=5.3.0",
    "numpy<2",
    "claw-compactor[accurate]>=7.1.0",
]
build = [
    "pywebview>=5.0,<6",
    "pyinstaller>=6.0,<8",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by line-length and formatter)
    "E402", # module level import not at top of file (needed for env initialization setup)
    "F841", # local variable assigned to but never used
    "N806", # variable in function should be lowercase
    "B023", # function definition does not bind loop variable
    "UP038", # use isinstance union instead of tuple (tuple is faster and more backwards compatible)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["utils", "telemetry_db", "telemetry_config", "telemetry_paths", "providers_config", "src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = false
files = [
    "dashboard/serve_dashboard.py",
    "src/telemetry/telemetry_db.py",
    "src/telemetry/telemetry_config.py",
    "src/telemetry/telemetry_paths.py",
    "src/telemetry/providers_config.py",
    "src/telemetry/telemetry_common.py",
    "src/telemetry/telemetry_metrics.py",
    "src/compaction/token_compactor.py",
    "src/compaction/smart_crusher.py",
    "cli/report.py",
    "src/compaction/claw_compactor_adapter.py",
    "src/compaction/headroom_adapter.py",
    "hub_files/src/utils/adaptive_context_manager.py",
    "hub_files/src/utils/consumption_report_validator.py",
    "hub_files/src/utils/diff_applier.py",
    "hub_files/src/utils/static_prompt_registry.py",
    "hub_files/src/utils/summarizer_factory.py",
    "hub_files/src/utils/task_brief_validator.py",
    "hub_files/src/utils/token_budget_guardrail.py"
]

[tool.pytest.ini_options]
testpaths = ["hub_files/src/utils"]
pythonpath = ["hub_files/src", "src/telemetry", "src/compaction", "src/bridge", "dashboard", "cli", "."]
python_files = ["test_*.py"]
# Coverage spans the real core (src/) plus hub_files/src/utils; test files are
# excluded from the metric (see [tool.coverage.run]). cov-fail-under is an honest
# ratchet floor: source-only coverage reached ~87% on 2026-07-24, gate set to 85%
# to leave CI variance margin. Raise it as coverage improves (target: 90%+).
addopts = "--cov=hub_files/src/utils --cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# Measure production code only; unit tests must not inflate the coverage metric.
omit = [
    "*/test_*.py",
]
