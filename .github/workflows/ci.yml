name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-format:
    name: Lint & Format (Python & Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.20 mypy==2.1.0 types-PyYAML

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter
        run: ruff format --check .

      - name: Run Mypy Type Checking
        run: mypy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js

      - name: Run Prettier Style Validation
        run: npm run format:check

  security:
    name: Security & Vulnerability Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Audit Dependencies with pip-audit
        run: pip-audit -r requirements-desktop.txt -r requirements-native-build.txt -r requirements-dev.txt --ignore-vuln PYSEC-2026-597

      - name: Scan Code with Bandit
        run: bandit -r serve_dashboard.py telemetry_db.py telemetry_config.py telemetry_paths.py providers_config.py token_compactor.py smart_crusher.py report.py claw_compactor_adapter.py headroom_adapter.py hub_files/src/utils/ --skip B101,B108,B110,B310,B404,B603,B607

      - name: Scan for Secret Leaks (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
          pip install -r requirements-dev.txt

      - name: Prepare Test Environment
        run: |
          cp hub_files/compression.env.example hub_files/compression.env

      - name: Run Tests with Coverage
        env:
          CURSOR_HOME: ${{ github.workspace }}/hub_files
          CURSOR_TOKEN_TELEMETRY_DATA_DIR: ${{ github.workspace }}/hub_files/token-telemetry
        run: |
          pytest

      - name: Verify Stack Sanity Checker
        env:
          HUB: ${{ github.workspace }}/hub_files
          CURSOR_TOKEN_TELEMETRY_DATA_DIR: ${{ github.workspace }}/hub_files/token-telemetry
        run: |
          python3 docs/verify_stack.py
