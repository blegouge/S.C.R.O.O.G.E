name: Automatic Release & Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release & Update Changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'bump:') && !contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Commitizen
        run: |
          python -m pip install --upgrade pip
          pip install commitizen

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Release Bump
        id: cz
        run: |
          set +e
          cz bump --yes
          exit_code=$?
          set -e
          if [ $exit_code -eq 21 ]; then
            echo "No commits to bump. Skipping release."
            echo "bumped=false" >> $GITHUB_OUTPUT
          elif [ $exit_code -ne 0 ]; then
            echo "cz bump failed with exit code $exit_code"
            exit $exit_code
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
            NEW_TAG=$(cz version -project)
            echo "tag=v${NEW_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Push Changes & Tags
        if: steps.cz.outputs.bumped == 'true'
        run: |
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.cz.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cz.outputs.tag }}
          name: Release ${{ steps.cz.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
